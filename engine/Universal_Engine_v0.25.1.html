<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#eef3fb;font:15px system-ui,sans-serif}

<script>
"use strict";
const VERSION="0.25.1-dev",KEY="universal-engine-save-v0241";
const MODS={economy:"Ekonomia",construction:"Budownictwo",population:"Mieszkańcy",world:"Mapa",walk:"Spacer 2D",base:"Edytor bazy",combat:"Walka",inventory:"Ekwipunek",rpg:"Postać",companions:"Towarzysze",quests:"Zadania",story:"Fabuła",diplomacy:"Dyplomacja",territory:"Terytoria",research:"Technologie",vehicles:"Pojazdy",events:"Wydarzenia",automation:"Automatyzacja",log:"Dziennik"};
const BUILDINGS={
 lumber:{name:"Tartak",cost:{gold:120,wood:15},days:2,production:{wood:6},workers:2},
 farm:{name:"Farma",cost:{gold:100,wood:10},days:2,production:{food:9},workers:2},
 market:{name:"Targowisko",cost:{gold:180,wood:20},days:3,production:{gold:24},workers:1}
};
const FRESH=()=>({schema:25,version:VERSION,day:1,hour:8,resources:{gold:1200,wood:25,food:40},reputation:0,place:"Twierdza",ruins:false,map:{discovered:["Twierdza","Las"],visited:["Twierdza"],scouted:[],zoom:1},walk:{positions:{},interacted:[],doors:{},room:"outdoor",dialogs:[],questFlags:[],baseLevel:0,interiorId:"magazyn",interiorLevel:0,returnPos:null},sites:{},buildMode:false,buildZoom:1,buildPreview:null,buildBrush:false,buildCamera:{x:0,y:0},worldSizes:{},cameraFollow:true,worldConfig:{biomeMode:"regional",terrainDensity:50},base:{tiles:{},tool:"floor",level:0,assignments:{},maxLevel:2,npcTick:0},combat:null,defeated:[],searched:[],technology:{points:0,unlocked:[],progress:null},fleet:[],activeVehicle:null,events:{pending:null,history:[],nextDay:3},automation:{autoSave:false,autoTrade:false,foodReserve:20},politics:{relations:{merchants:0,wardens:-20,nomads:10},treaties:{},territories:{Twierdza:"player",Las:"neutral",Ruiny:"neutral"},cooldowns:{},turns:0},story:{chapter:"arrival",choices:{},eventsSeen:[],ending:null},quests:{supplies:"active",ruins:"locked"},population:{total:12,happiness:65,residents:[]},buildings:[],inventory:[{id:"sword",name:"Miecz",qty:1,slot:"weapon",attack:3},{id:"coat",name:"Skórzana kurtka",qty:1,slot:"armor",defense:2},{id:"potion",name:"Mikstura leczenia",qty:2,heal:25}],hero:{name:"Bohater",level:1,xp:0,hp:100,maxHp:100,stats:{strength:5,agility:5,intellect:5},equipment:{weapon:null,armor:null},points:0},companions:[{id:"mira",name:"Mira",role:"Zwiadowczyni",recruited:false,affinity:0},{id:"borin",name:"Borin",role:"Wojownik",recruited:false,affinity:0}],log:["Rozpoczęto kampanię demonstracyjną."],modules:Object.fromEntries(Object.keys(MODS).map(k=>[k,true])),settings:{title:"Kraina demonstracyjna",difficulty:"normal",genre:"fantasy",seed:1}});
let s=FRESH(),tab="home";
let campaignDraft=null;
let devEnabled=false,devAmount=100,devMessage="",devNpcs=[];
const el=id=>document.getElementById(id);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const labels={gold:"Złoto",wood:"Drewno",food:"Żywność"};
const fmtCost=c=>Object.entries(c).map(([k,v])=>v+" "+(labels[k]||k)).join(", ");
let walkToastTimer=null;
function showWalkToast(message,duration=3200){
 const info=el("walkInfo");if(!info)return;
 clearTimeout(walkToastTimer);
 info.textContent=message;
 info.classList.add("visible");
 walkToastTimer=setTimeout(()=>{info.classList.remove("visible");},duration);
}
function note(t){s.log.unshift("Dzień "+s.day+": "+t);s.log=s.log.slice(0,120)}
function has(cost){return Object.entries(cost).every(([k,v])=>s.resources[k]>=v)}
function spend(cost){if(!has(cost))return false;Object.entries(cost).forEach(([k,v])=>s.resources[k]-=v);return true}
function gain(values){Object.entries(values).forEach(([k,v])=>s.resources[k]=(s.resources[k]||0)+v)}
function workersUsed(){return s.buildings.filter(b=>b.remaining===0).reduce((n,b)=>n+BUILDINGS[b.id].workers,0)}
function freeWorkers(){return Math.max(0,s.population.total-workersUsed())}
function xp(amount){s.hero.xp+=amount;while(s.hero.xp>=s.hero.level*100){s.hero.xp-=s.hero.level*100;s.hero.level++;s.hero.points+=2;s.hero.maxHp+=10;s.hero.hp=s.hero.maxHp;note("Awans! Poziom "+s.hero.level+"; +2 punkty cech.")}}
function completeQuests(){
 if(s.quests.supplies==="active"&&s.resources.wood>=40){s.quests.supplies="done";s.quests.ruins="active";gain({gold:100});xp(50);s.reputation++;note("Zadanie Dostawy ukończone: +100 złota, +1 reputacji.")}
 if(s.quests.ruins==="active"&&s.ruins){s.quests.ruins="done";s.reputation+=2;xp(80);note("Zadanie Odkryj ruiny ukończone: +2 reputacji.")}
}
const LOCATIONS={
 "Twierdza":{neighbors:["Las","Wioska"],cost:2,hours:3,x:105,y:180,kind:"osada",description:"Centrum administracyjne i gospodarcze."},
 "Las":{neighbors:["Twierdza","Ruiny","Jezioro"],cost:2,hours:3,x:225,y:100,kind:"natura",description:"Szlak leśny, w którym można odnaleźć ruiny."},
 "Ruiny":{neighbors:["Las","Kopalnia"],cost:3,hours:4,x:365,y:65,kind:"ruiny",description:"Pozostałości dawnej cywilizacji."},
 "Wioska":{neighbors:["Twierdza","Jezioro"],cost:2,hours:2,x:110,y:300,kind:"osada",description:"Mała osada na południu."},
 "Jezioro":{neighbors:["Wioska","Las","Kopalnia"],cost:2,hours:3,x:265,y:265,kind:"natura",description:"Wody i mokradła."},
 "Kopalnia":{neighbors:["Ruiny","Jezioro"],cost:3,hours:4,x:405,y:220,kind:"surowce",description:"Złoża surowców."}
};
const MAP_SCOUT={Wioska:{gold:25},Jezioro:{food:12},Kopalnia:{wood:18}};
function revealNeighbors(place){
 for(const id of LOCATIONS[place].neighbors)if(!s.map.discovered.includes(id))s.map.discovered.push(id);
}

// Local tile maps: # wall, . ground, O object, E exit, ~ water.
const WALK_MAPS={
 "Twierdza":["############","#..........#","#..##......#","#..##..O...#","#..........#","#.....###..#","#..........#","#..O.......#","#..........#","#####EE#####"],
 "Las":["############","#..O.......#","#..###.....#","#..........#","#....~~~...#","#....~~~...#","#..........#","#..O....##.#","#..........#","#####EE#####"],
 "Ruiny":["############","#..##......#","#..##..O...#","#..........#","#.###......#","#..........#","#.....##...#","#..O..##...#","#..........#","#####EE#####"],
 "Wioska":["############","#..........#","#..OO......#","#..........#","#....###...#","#....###...#","#..........#","#..........#","#..........#","#####EE#####"],
 "Jezioro":["############","#..........#","#.~~~~.....#","#.~~~~.....#","#..........#","#.....~~~~.#","#.....~~~~.#","#..........#","#..........#","#####EE#####"],
 "Kopalnia":["############","#...###....#","#...###.O..#","#..........#","#..####....#","#..........#","#..O.......#","#......##..#","#..........#","#####EE#####"]
};
// Większe mapy 22×18: zachowujemy oryginalne współrzędne NPC i wyjść.
const WALK_W=22,WALK_H=18,TILE=32;
for(const [place,original] of Object.entries(WALK_MAPS)){
 const expanded=Array.from({length:WALK_H},(_,y)=>Array.from({length:WALK_W},(_,x)=>{
  if(x===0||x===WALK_W-1||y===0||y===WALK_H-1)return "#";
  if(y<original.length&&x<original[0].length){
   const old=original[y][x];
   if((x===original[0].length-1||y===original.length-1)&&old==="#")return ".";
   return old;
  }
  const seed=x*37+y*71+place.length*13;
  if(x>12&&y>10&&seed%31===0)return "O";
  return ".";
 }));
 // Drugie wyjście na nowej, południowej krawędzi.
 expanded[WALK_H-1][Math.floor(WALK_W/2)]="E";
 WALK_MAPS[place]=expanded.map(row=>row.join(""));
}


// Dziedziniec v0.24.1: mapa zaprojektowana od zera, bez starych struktur.
// Każde wejście to D w ZEWNĘTRZNEJ ścianie budynku; podejście od południa jest wolne.
const CASTLE_LAYOUT=[
 {id:"gatehouse",room:"brama",name:"Brama główna",x:31,y:8,w:9,h:7},
 {id:"armory",room:"zbrojownia",name:"Zbrojownia",x:13,y:19,w:10,h:8},
 {id:"barracks",room:"koszary",name:"Koszary",x:26,y:19,w:12,h:9},
 {id:"infirmary",room:"lecznica",name:"Lecznica",x:42,y:19,w:11,h:8},
 {id:"stable",room:"stajnia",name:"Stajnia",x:57,y:19,w:12,h:8},
 {id:"workshop",room:"warsztat",name:"Warsztat",x:13,y:34,w:11,h:9},
 {id:"storage",room:"magazyn",name:"Magazyn",x:28,y:34,w:11,h:9},
 {id:"council",room:"sala",name:"Sala rady",x:43,y:34,w:13,h:10},
 {id:"kitchen",room:"kuchnia",name:"Kuchnia",x:60,y:34,w:10,h:9},
 {id:"cellar",room:"piwnica",name:"Piwnica",x:13,y:51,w:11,h:9},
 {id:"library",room:"biblioteka",name:"Biblioteka",x:28,y:51,w:12,h:9},
 {id:"chapel",room:"kaplica",name:"Kaplica",x:44,y:51,w:11,h:9},
 {id:"tower",room:"wieza",name:"Wieża strażnicza",x:60,y:51,w:10,h:9}
];
const CASTLE_PORTALS=CASTLE_LAYOUT.map(b=>({id:b.id,x:b.x+Math.floor(b.w/2),y:b.y+b.h-1,room:b.room,name:b.name}));
const castleTerrain=new Map();
function castlePut(x,y,t){castleTerrain.set(x+","+y,t);}
for(let y=5;y<=75;y++)for(let x=8;x<=75;x++)castlePut(x,y,".");
// Mury obwodowe i trzy przechodnie bramy; wszystkie obiekty stoją wewnątrz.
for(let x=8;x<=75;x++){castlePut(x,5,"#");castlePut(x,75,"#");}
for(let y=5;y<=75;y++){castlePut(8,y,"#");castlePut(75,y,"#");}
for(const x of [35,36,37,38])castlePut(x,75,"E");
for(const y of [37,38])castlePut(8,y,"E");
for(const y of [37,38])castlePut(75,y,"E");
// Ścieżki, ogrody i studnia; nie blokują dostępu do drzwi.
for(let y=15;y<=72;y++)for(let x=35;x<=37;x++)if(!castleTerrain.has(x+","+y)||castleTerrain.get(x+","+y)===".")castlePut(x,y,".");
for(const b of CASTLE_LAYOUT){
 for(let y=b.y;y<b.y+b.h;y++)for(let x=b.x;x<b.x+b.w;x++){
  const wall=x===b.x||x===b.x+b.w-1||y===b.y||y===b.y+b.h-1;
  castlePut(x,y,wall?"#":".");
 }
 castlePut(b.x+Math.floor(b.w/2),b.y+b.h-1,"D");
}
for(const [x,y] of [[20,14],[53,13],[68,13],[19,47],[52,47],[66,47],[18,66],[51,66],[66,66]])castlePut(x,y,"O");
// Studnia i pomnik jako obiekty interaktywne, a nie nieprzechodnie mury.
castlePut(41,30,"O");castlePut(41,65,"O");
// World map v0.22: deterministic terrain calculated only for requested tiles.
const WORLD_SIZES=[32,64,128,256,512,1024],VIEW_W=17,VIEW_H=13;
function viewportTiles(){const zoom=Math.max(.25,Math.min(3,Number(s.buildZoom)||1));return {w:Math.max(6,Math.round(VIEW_W/zoom)),h:Math.max(5,Math.round(VIEW_H/zoom))};}
function setWalkZoom(z){s.buildZoom=Math.max(.25,Math.min(3,Math.round(z*100)/100));s.buildPreview=null;drawWalk();const label=el("buildZoomLabel");if(label)label.textContent=Math.round(s.buildZoom*100)+"%";}

function worldSize(place=s.place){return WORLD_SIZES.includes(s.worldSizes?.[place])?s.worldSizes[place]:128;}
function outdoor(){return s.walk.room==="outdoor";}
function tileHash(x,y,seed){let n=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(seed,1442695041);n=Math.imul(n^(n>>>13),1274126177);return (n^(n>>>16))>>>0;}
// Sektory 32x32: generacja deterministyczna; cache LRU ograniczony do 12 sektorów.
const SECTOR_SIZE=32,SECTOR_CACHE_LIMIT=12;
const sectorCache=new Map();
const BIOMES={grass:{name:"Łąki",color:"#72916b"},forest:{name:"Las",color:"#3c7950"},desert:{name:"Pustynia",color:"#c4a96c"},marsh:{name:"Bagna",color:"#658477"},rock:{name:"Skały",color:"#85827d"},water:{name:"Wody",color:"#4386a5"}};
function biomeAt(x,y,place=s.place){
 const seed=String(place).split("").reduce((n,c)=>n+c.charCodeAt(0),s.settings.seed||1);
 const bx=Math.floor(x/24),by=Math.floor(y/24),v=tileHash(bx,by,seed+201)%100;
 const primary=place==="Las"?"forest":place==="Jezioro"?"marsh":place==="Kopalnia"||place==="Ruiny"?"rock":"grass";
 if(v<54)return primary;
 if(v<69)return "grass";
 if(v<81)return "forest";
 if(v<89)return "rock";
 if(v<96)return "marsh";
 return "desert";
}
function rawWorldTile(x,y,place=s.place){
 const size=worldSize(place);if(x<0||y<0||x>=size||y>=size)return "#";
 if(place==="Twierdza"){return castleTerrain.get(x+","+y)??(x===0||y===0||x===size-1||y===size-1?"#":".");}
 const old=WALK_MAPS[place];if(y<old.length&&x<old[0].length)return old[y][x];
 if(x===0||y===0||x===size-1||y===size-1)return "#";
 const seed=String(place).split("").reduce((n,c)=>n+c.charCodeAt(0),s.settings.seed||1);
 const biome=biomeAt(x,y,place),noise=tileHash(x,y,seed+19)%100;
 const density=Math.max(0,Math.min(100,s.worldConfig?.terrainDensity??50));
 const limit=Math.floor(density/7);
 if(biome==="marsh"&&noise<16+limit)return "~";
 if(biome==="forest"&&noise<15+limit)return "O";
 if(biome==="rock"&&noise<9+limit)return "#";
 if(biome==="desert"&&noise<3+Math.floor(limit/2))return "O";
 if(noise<Math.floor(limit/2))return "O";
 return ".";
}
function worldSector(sx,sy,place=s.place){
 const key=[place,worldSize(place),s.settings.seed,s.worldConfig?.terrainDensity??50,sx,sy].join("|");
 if(sectorCache.has(key)){const found=sectorCache.get(key);sectorCache.delete(key);sectorCache.set(key,found);return found;}
 const tiles=Array.from({length:SECTOR_SIZE},(_,ly)=>Array.from({length:SECTOR_SIZE},(_,lx)=>rawWorldTile(sx*SECTOR_SIZE+lx,sy*SECTOR_SIZE+ly,place)));
 sectorCache.set(key,tiles);
 if(sectorCache.size>SECTOR_CACHE_LIMIT)sectorCache.delete(sectorCache.keys().next().value);
 return tiles;
}
function worldTile(x,y){
 if(x<0||y<0||x>=worldSize()||y>=worldSize())return "#";

const BASE_W=10,BASE_H=8;
const BASE_TOOLS={floor:{name:"Podłoga",cost:{wood:1,gold:2},layer:"floor",symbol:"·"},wall:{name:"Ściana",cost:{wood:2,gold:5},layer:"structure",symbol:"▣"},door:{name:"Drzwi",cost:{wood:3,gold:8},layer:"structure",symbol:"▤"},bed:{name:"Łóżko",cost:{wood:4,gold:12},layer:"furniture",symbol:"▥"},storage:{name:"Magazyn",cost:{wood:5,gold:15},layer:"furniture",symbol:"▦"},generator:{name:"Generator",cost:{wood:8,gold:40},layer:"furniture",symbol:"⚡"},cable:{name:"Przewód",cost:{wood:1,gold:4},layer:"furniture",symbol:"⌁"},lift:{name:"Winda",cost:{wood:12,gold:70},layer:"furniture",symbol:"↕"},erase:{name:"Rozbierz",cost:{},layer:"erase",symbol:"×"}};

function buildAllowed(x,y){
 const [w,h]=buildDims(),tool=s.base.tool;
 if(!Number.isInteger(x)||!Number.isInteger(y)||x<0||y<0||x>=w||y>=h)return {ok:false,why:"Poza mapą"};
 if(s.combat||s.events.pending)return {ok:false,why:"Trwa walka lub wydarzenie"};
 const t=buildTile(x,y),def=BASE_TOOLS[tool];
 if(!def)return {ok:false,why:"Nieznany element"};
 if(buildArea()==="interior")return {ok:false,why:"Budowanie w tym pomieszczeniu jest niedostępne"};
 if(buildArea()==="outdoor"){
  const natural=worldTile(x,y);
  if(natural!==".")return {ok:false,why:"Teren niedostępny"};
  if(localEntities().some(e=>e.x===x&&e.y===y))return {ok:false,why:"Pole zajęte przez NPC"};
 }
 if(s.walk.room==="outdoor"&&s.walk.positions[s.place+":outdoor"]?.x===x&&s.walk.positions[s.place+":outdoor"]?.y===y&&tool!=="floor"&&tool!=="erase")return {ok:false,why:"Bohater stoi na polu"};
 if(tool==="erase")return {ok:!!(t.floor||t.structure||t.furniture),why:(t.floor||t.structure||t.furniture)?"Można rozebrać":"Brak konstrukcji"};
 if(t[def.layer])return {ok:false,why:"Pole tej warstwy jest zajęte — najpierw rozbierz element"};
 if(def.layer!=="floor"&&!t.floor)return {ok:false,why:"Najpierw postaw podłogę"};
 if(def.layer==="furniture"&&t.structure)return {ok:false,why:"Pole zajęte przez ścianę lub drzwi"};
 if(def.layer==="structure"&&t.furniture)return {ok:false,why:"Najpierw usuń wyposażenie"};
 if(!has(def.cost)){const missing=Object.entries(def.cost).filter(([k,v])=>s.resources[k]<v).map(([k,v])=>(labels[k]||k)+": masz "+s.resources[k]+", potrzeba "+v);return {ok:false,why:"Brak surowców — "+missing.join("; ")};}

function buildAt(x,y){

 if(!result.ok){showBuildReason(x,y);return false;}

  const key=baseKey(x,y,s.walk.baseLevel),t={...buildTile(x,y)},tool=s.base.tool,def=BASE_TOOLS[tool];
  if(tool==="erase"){if(t.furniture)delete t.furniture;else if(t.structure)delete t.structure;else delete t.floor;}
  else{if(!spend(def.cost)){showBuildReason(x,y);return false;}t[def.layer]=tool;}
  if(Object.keys(t).length)s.base.tiles[key]=t;else delete s.base.tiles[key];
  note("Budowa na poziomie "+s.walk.baseLevel+": "+def.name+" ("+(x+1)+","+(y+1)+").");
 }
 else{
  const key=siteKey(x,y),t={...buildTile(x,y)},tool=s.base.tool,def=BASE_TOOLS[tool];
  if(tool==="erase"){if(t.furniture)delete t.furniture;else if(t.structure)delete t.structure;else delete t.floor;}
  else{if(!spend(def.cost)){showBuildReason(x,y);return false;}t[def.layer]=tool;}
  if(Object.keys(t).length)s.sites[key]=t;else delete s.sites[key];

// A room is a connected floor region whose perimeter is fully enclosed by walls/doors.
function baseRooms(level=s.base.level){
 const seen=new Set(),rooms=[];
 for(let y=0;y<BASE_H;y++)for(let x=0;x<BASE_W;x++){
  const first=baseKey(x,y,level),tile=baseTileAt(level,x,y);
  if(seen.has(first)||!tile.floor||tile.structure)continue;
  const queue=[[x,y]],cells=[],fixtures=[],doors=new Set();let enclosed=true;
  seen.add(first);
  for(let i=0;i<queue.length;i++){
   const [cx,cy]=queue[i];cells.push([cx,cy]);
   const current=baseTileAt(level,cx,cy);if(current.furniture)fixtures.push({x:cx,y:cy,type:current.furniture});
   for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=cx+dx,ny=cy+dy;
    if(nx<0||ny<0||nx>=BASE_W||ny>=BASE_H){enclosed=false;continue;}
    const neighbor=baseTileAt(level,nx,ny);
    if(neighbor.structure){if(neighbor.structure==="door")doors.add(baseKey(nx,ny,level));continue;}
    if(!neighbor.floor){enclosed=false;continue;}
    const key=baseKey(nx,ny,level);if(!seen.has(key)){seen.add(key);queue.push([nx,ny]);}
   }
  }
  rooms.push({id:cells.map(([a,b])=>baseKey(a,b,level)).sort()[0],cells,fixtures,doors:doors.size,enclosed});
 }
 return rooms;
}
function basePowerNetwork(){
 // Przewody łączą się ortogonalnie z generatorami i magazynami; osobno na każdej kondygnacji.
 const networks=[];
 for(let level=0;level<=2;level++){
  const visited=new Set();
  for(let y=0;y<BASE_H;y++)for(let x=0;x<BASE_W;x++){
   const tile=baseTileAt(level,x,y),key=baseKey(x,y,level);
   if(!["generator","cable","storage"].includes(tile.furniture)||visited.has(key))continue;
   const queue=[[x,y]],members=[];visited.add(key);
   for(let i=0;i<queue.length;i++){
    const [cx,cy]=queue[i],t=baseTileAt(level,cx,cy);members.push({x:cx,y:cy,type:t.furniture});
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
     const nx=cx+dx,ny=cy+dy,k=baseKey(nx,ny,level);
     if(nx<0||ny<0||nx>=BASE_W||ny>=BASE_H||visited.has(k))continue;
     if(["generator","cable","storage"].includes(baseTileAt(level,nx,ny).furniture)){visited.add(k);queue.push([nx,ny]);}
    }
   }
   networks.push({level,members,capacity:members.filter(m=>m.type==="generator").length*4});
  }
 }
 return networks;
}
const RESIDENT_NAMES=["Alicja","Borys","Celina","Damian","Eliza","Filip","Gabriela","Hubert","Iga","Jan","Klara","Leon","Marta","Norbert","Ola","Piotr"];
function ensureResidents(){
 if(!Array.isArray(s.population.residents))s.population.residents=[];
 const r=s.population.residents;
 while(r.length<s.population.total){const n=r.length;r.push({id:"r"+(n+1),name:RESIDENT_NAMES[n%RESIDENT_NAMES.length]+" "+(Math.floor(n/RESIDENT_NAMES.length)+1),job:"none",room:null,shift:"day",hunger:80,energy:85,morale:70,location:"home"});}
 if(r.length>s.population.total)r.length=s.population.total;
 return r;
}
function residentStatus(r,hour=s.hour){
 const work=r.shift==="night"?(hour>=22||hour<6):(hour>=8&&hour<16);
 if(r.energy<20)return "odpoczynek";
 if(r.hunger<25)return "posiłek";
 return r.job!=="none"&&work?"praca":(hour>=22||hour<6?"sen":"czas wolny");
}
function residentRooms(){return [0,1,2].flatMap(level=>baseRooms(level)).filter(r=>r.enclosed).map(r=>({id:r.id,level:r.level}));}
function assignResident(id,job,room){
 const r=ensureResidents().find(x=>x.id===id);if(!r)return;
 if(!["none","warehouse","builder","guard"].includes(job))return;
 if(job==="warehouse"&&room&&!residentRooms().some(x=>x.id===room))return;
 r.job=job;r.room=job==="warehouse"?room:null;
 syncResidentAssignments();note("Przydział: "+r.name+" — "+job);render();
}
function syncResidentAssignments(){
 const count={};for(const r of ensureResidents())if(r.job==="warehouse"&&r.room&&r.hunger>20&&r.energy>15)count[r.room]=(count[r.room]||0)+1;
 if(ensureResidents().some(r=>r.job==="warehouse"))s.base.assignments=count;
}
function residentDay(){
 for(const r of ensureResidents()){
  const wasWorking=r.job!=="none";
  r.hunger=Math.max(0,r.hunger-(wasWorking?20:14));
  r.energy=Math.max(0,Math.min(100,r.energy+(r.shift==="night"?9:14)-(wasWorking?17:5)));
  if(s.resources.food>0&&r.hunger<65)r.hunger=Math.min(100,r.hunger+24);
  r.morale=Math.max(0,Math.min(100,r.morale+(r.hunger<25?-8:2)+(r.energy<25?-6:0)));
 }
 syncResidentAssignments();
 const residents=s.population.residents;
 if(residents.length)s.population.happiness=Math.max(0,Math.min(100,Math.round(residents.reduce((n,r)=>n+r.morale,0)/residents.length)));
}
function residentView(){
 const rs=ensureResidents(),rooms=residentRooms();
 return '<div class="card"><h2>Mieszkańcy — indywidualne zarządzanie</h2><p class="note">Zmiana zawodu i zmiany roboczej nie wymaga czasu. Praca magazynowa działa w zamkniętych pomieszczeniach w godzinach zmiany, pod warunkiem zaspokojenia potrzeb.</p>'+stats()+
 '<p>Populacja: '+rs.length+' • Średnie morale: '+s.population.happiness+'%</p>'+
 rs.map(r=>'<div class="item"><b>'+esc(r.name)+'</b> <span class="note">('+esc(r.id)+')</span><p>Stan: '+residentStatus(r)+' • Głód: '+r.hunger+'/100 • Energia: '+r.energy+'/100 • Morale: '+r.morale+'/100</p>'+
 '<label>Zawód <select data-resident-job="'+r.id+'">'+[["none","Bez przydziału"],["warehouse","Magazynier"],["builder","Budowniczy"],["guard","Strażnik"]].map(([k,v])=>'<option value="'+k+'" '+(r.job===k?'selected':'')+'>'+v+'</option>').join('')+'</select></label>'+
 '<label>Zmiana <select data-resident-shift="'+r.id+'"><option value="day" '+(r.shift==='day'?'selected':'')+'>Dzienna 08–16</option><option value="night" '+(r.shift==='night'?'selected':'')+'>Nocna 22–06</option></select></label>'+
 (r.job==='warehouse'?'<label>Pomieszczenie <select data-resident-room="'+r.id+'"><option value="">Wybierz pomieszczenie</option>'+rooms.map(x=>'<option value="'+esc(x.id)+'" '+(r.room===x.id?'selected':'')+'>'+esc(x.id)+'</option>').join('')+'</select></label>':'')+'</div>').join('')+'</div>';
}
function baseOperations(){
 const rooms=[0,1,2].flatMap(level=>baseRooms(level));
 const networks=basePowerNetwork();
 const available=Math.max(0,s.population.total-workersUsed());let free=available;
 const results=rooms.map(r=>{
  const beds=r.fixtures.filter(f=>f.type==="bed").length;
  const stores=r.fixtures.filter(f=>f.type==="storage").length;
  const generatorsHere=r.fixtures.filter(f=>f.type==="generator").length;
  const desired=Math.max(0,Math.min(10,Number(s.base.assignments[r.id])||0));
  const workers=r.enclosed?Math.min(desired,free):0;free-=workers;
  let powered=0;
  if(r.enclosed)for(const f of r.fixtures.filter(f=>f.type==="storage")){
   const network=networks.find(n=>n.members.some(m=>m.x===f.x&&m.y===f.y&&r.id.startsWith(n.level+":")));
   if(network&&network.capacity>0){network.capacity--;powered++;}
  }
  return {...r,beds,stores,generators:generatorsHere,workers,powered,desired,production:{food:Math.min(workers,powered)*2,gold:Math.min(workers,powered)*3}};
 });
 const capacity=networks.reduce((sum,n)=>sum+n.members.filter(m=>m.type==="generator").length*4,0);
 return {rooms:results,capacity,used:results.reduce((sum,r)=>sum+r.powered,0),available,free,networks:networks.length};
}
function baseAssign(roomId,delta){
 const r=[0,1,2].flatMap(level=>baseRooms(level)).find(x=>x.id===roomId);if(!r||!r.enclosed)return;
 const current=Number(s.base.assignments[roomId])||0;
 s.base.assignments[roomId]=Math.max(0,Math.min(10,current+delta));render();
}
function baseLevelSet(level){if(!Number.isInteger(level)||level<0||level>2)return;s.base.level=level;render();}

 '<p class="note">Podłogi: '+stats.floor+' • Ściany: '+stats.wall+' • Drzwi: '+stats.door+' • Łóżka: '+stats.bed+' • Magazyny: '+stats.storage+' • Generatory: '+stats.generator+'</p>'+
 '<h3>Pomieszczenia i gospodarka</h3><p class="note">Generator dostarcza 4 jednostki energii w swojej sieci przewodów. Magazyn musi być połączony z generatorem bezpośrednio lub przez przewody. Każdy zasilony magazyn z przydzielonym pracownikiem produkuje 2 żywności i 3 złota dziennie. Łóżka zwiększają pojemność mieszkalną (na razie informacyjnie).</p>'+
 '<p>Energia: '+ops.used+' / '+ops.capacity+' • Sieci: '+ops.networks+' • Dostępni pracownicy: '+ops.available+' • Wolni: '+ops.free+'</p>'+
 (ops.rooms.filter(r=>r.id.startsWith(s.base.level+":")).length?ops.rooms.filter(r=>r.id.startsWith(s.base.level+":")).map((r,i)=>'<div class="card"><b>Obszar '+(i+1)+'</b> — '+(r.enclosed?'zamknięty pokój':'otwarta przestrzeń')+' ('+r.cells.length+' pól)'+
 '<p>Drzwi: '+r.doors+' • Łóżka: '+r.beds+' • Magazyny: '+r.stores+' • Generatory: '+r.generators+'</p>'+
 '<p>Pracownicy: '+r.workers+' / '+r.desired+' • Zasilone magazyny: '+r.powered+' • Dziennie: +'+r.production.food+' żywności, +'+r.production.gold+' złota</p>'+
 (r.enclosed?'<div class="actions"><button data-base-assign="'+r.id+'" data-base-delta="-1">− pracownik</button><button data-base-assign="'+r.id+'" data-base-delta="1">+ pracownik</button></div>':'<p class="note">Aby uruchomić produkcję, zamknij pomieszczenie ścianami lub drzwiami.</p>')+'</div>').join(''):'<p class="note">Zbuduj podłogę, by rozpocząć wyznaczanie pomieszczeń.</p>')+'</div>';

 const seen=id=>s.map.discovered.includes(id),visited=id=>s.map.visited.includes(id);
 const lines=Object.entries(LOCATIONS).flatMap(([id,l])=>l.neighbors.filter(n=>id<n&&seen(id)&&seen(n)).map(n=>'<line x1="'+l.x+'" y1="'+l.y+'" x2="'+LOCATIONS[n].x+'" y2="'+LOCATIONS[n].y+'" stroke="#6686a6" stroke-width="4" stroke-dasharray="7 6"/>')).join("");

const ENEMIES={
 wolf:{name:"Wilk",hp:26,attack:7,defense:1,xp:35,gold:12,loot:"hide"},
 raider:{name:"Bandyta",hp:42,attack:10,defense:2,xp:55,gold:28,loot:"potion"}
};
const LOOT={
 hide:{id:"hide",name:"Skóra",qty:1},
 potion:{id:"potion",name:"Mikstura leczenia",qty:1,heal:25}
};
function addItem(item){const found=s.inventory.find(x=>x.id===item.id);if(found)found.qty+=item.qty;else s.inventory.push({...item})}
function heroAttack(){const w=s.inventory.find(x=>x.id===s.hero.equipment.weapon);return 5+s.hero.stats.strength+(w?.attack||0)}
function heroDefense(){const a=s.inventory.find(x=>x.id===s.hero.equipment.armor);return Math.floor(s.hero.stats.agility/2)+(a?.defense||0)}
function startFight(kind){if(s.combat)return alert("Walka już trwa.");const def=ENEMIES[kind];if(!def)return;s.combat={kind,hp:def.hp,guard:false,turn:1};note("Rozpoczęto walkę: "+def.name);render()}
function enemyTurn(){
 const c=s.combat;if(!c)return;
 const e=ENEMIES[c.kind],damage=Math.max(1,e.attack-heroDefense()-(c.guard?4:0));
 c.guard=false;s.hero.hp=Math.max(0,s.hero.hp-damage);note(e.name+" zadaje "+damage+" obrażeń.");
 if(s.hero.hp<=0){note("Bohater poległ. Powrót do twierdzy, utrata 50 złota.");s.resources.gold=Math.max(0,s.resources.gold-50);s.hero.hp=Math.max(1,Math.floor(s.hero.maxHp/2));s.place="Twierdza";s.combat=null;}
}
function fightMove(move){
 const c=s.combat;if(!c)return;const enemy=ENEMIES[c.kind];
 if(move==="attack"){const damage=Math.max(1,heroAttack()-enemy.defense);c.hp=Math.max(0,c.hp-damage);note("Zadano "+damage+" obrażeń.");}
 if(move==="guard"){c.guard=true;note("Przyjęto postawę obronną.");}
 if(move==="potion"){const potion=s.inventory.find(x=>x.id==="potion"&&x.qty>0);if(!potion)return alert("Brak mikstury.");potion.qty--;s.hero.hp=Math.min(s.hero.maxHp,s.hero.hp+25);note("Wypito miksturę.");}
 if(c.hp<=0){note("Zwycięstwo: "+enemy.name+". +"+enemy.gold+" złota, +"+enemy.xp+" XP.");gain({gold:enemy.gold});xp(enemy.xp);addItem(LOOT[enemy.loot]);s.defeated.push(c.kind);s.combat=null;}
 else{enemyTurn();if(s.combat)s.combat.turn++;}
 advance(1);
}

const STORY_BY_ID=Object.fromEntries(STORY_EVENTS.map(e=>[e.id,e]));
function chooseStory(index){
 if(s.combat)return alert("Najpierw zakończ walkę.");
 const event=STORY_BY_ID[s.story.chapter];
 if(!event||s.story.ending)return;
 const option=event.options[index];
 if(!option)return;
 if(option.cost&&!spend(option.cost))return alert("Brak wymaganych zasobów.");
 if(option.effect){for(const [k,v] of Object.entries(option.effect)){
  if(k==="reputation")s.reputation+=v;
  else s.resources[k]=Math.max(0,(s.resources[k]||0)+v);
 }}
 s.story.choices[event.id]=option.flag;
 s.story.eventsSeen.push(event.id);
 note(event.title+": "+option.result);
 if(option.ending){s.story.ending=option.ending;s.story.chapter="end";note("Zakończenie kampanii: "+option.ending);}
 else s.story.chapter=option.next;
 advance(1);
}
function storyView(){
 if(s.story.ending)return '<div class="card"><h2>Zakończenie kampanii</h2><p>'+ (s.story.ending==="alliance"?"Porozumienie i współpraca":"Niezależność osady")+'</p><p>Twoje decyzje zostały zapisane w stanie świata.</p></div>';
 const e=STORY_BY_ID[s.story.chapter];
 if(!e)return '<div class="card">Brak aktywnego wydarzenia.</div>';
 return '<div class="card"><h2>'+esc(e.title)+'</h2><p>'+esc(e.text)+'</p><div class="actions">'+e.options.map((o,i)=>button(o.label,"story",String(i),!!o.cost&&!has(o.cost))).join("")+'</div><h3>Podjęte decyzje</h3>'+Object.entries(s.story.choices).map(([k,v])=>'<p>'+esc(k)+": "+esc(v)+'</p>').join("")+'</div>';
}

const FACTIONS={
 merchants:{name:"Liga Kupców",description:"Handel i dostawy",bonus:"Dochód +8 złota/dzień"},
 wardens:{name:"Straż Pogranicza",description:"Bezpieczeństwo granic",bonus:"Ochrona +1 reputacji co 3 dni"},
 nomads:{name:"Wolne Klany",description:"Wędrowne społeczności",bonus:"Żywność +3/dzień"}
};
function relation(id){return s.politics.relations[id]||0}
function changeRelation(id,delta){s.politics.relations[id]=Math.max(-100,Math.min(100,relation(id)+delta))}
function politicsAction(type,id){
 const p=s.politics,day=s.day;
 if(type==="envoy"){
  if((p.cooldowns[id]||0)>day)return alert("Wysłannik może wrócić później.");
  if(!spend({gold:30}))return alert("Potrzeba 30 złota.");
  changeRelation(id,15);p.cooldowns[id]=day+3;note("Misja dyplomatyczna: "+FACTIONS[id].name+" (+15 relacji).");advance(2);
 }else if(type==="treaty"){
  if(relation(id)<40)return alert("Wymagane relacje: 40.");
  if(!spend({gold:80}))return alert("Potrzeba 80 złota.");
  p.treaties[id]=true;note("Zawarto porozumienie z "+FACTIONS[id].name+".");advance(1);
 }else if(type==="break"){
  delete p.treaties[id];changeRelation(id,-25);note("Zerwano porozumienie z "+FACTIONS[id].name+".");advance(1);
 }else if(type==="claim"){
  if(s.place!==id)return alert("Musisz przebywać w tej lokacji.");
  if(id==="Ruiny"&&!s.searched.includes("Ruiny"))return alert("Najpierw przeszukaj ruiny.");
  if(!spend({gold:100,wood:10}))return alert("Potrzeba 100 złota i 10 drewna.");
  p.territories[id]="player";s.reputation++;note("Przejęto terytorium: "+id+".");advance(4);
 }else if(type==="secure"){
  if(p.territories[id]!=="player")return;
  if(!spend({gold:50,wood:5}))return alert("Potrzeba 50 złota i 5 drewna.");
  p.territories[id]="secured";note("Zabezpieczono terytorium: "+id+".");advance(3);
 }
}

 Object.entries(FACTIONS).map(([id,f])=>'<div class="item"><b>'+f.name+'</b><p>'+f.description+' • Relacje: '+relation(id)+' • Traktat: '+(s.politics.treaties[id]?'aktywny':'brak')+'</p><p class="note">'+f.bonus+'</p>'+

}

 }else if(type==="repair"){

 const pool=EVENT_POOL.filter(e=>!s.events.history.slice(-2).includes(e.id));

  const oldSchema=x.schema;

   x.technology={points:0,unlocked:[],progress:null};x.fleet=[];x.activeVehicle=null;x.modules.research=true;x.modules.vehicles=true;
  }
  if(oldSchema<=7){x.events={pending:null,history:[],nextDay:x.day+3};x.automation={autoSave:false,autoTrade:false,foodReserve:20};x.modules.events=true;x.modules.automation=true;}
  x.schema=11;
 }
 if(x.schema<11||x.schema>25)throw Error("Obsługiwane zapisy: v0.5–v2.0.");
 if(!x.map)x.map={discovered:["Twierdza","Las"],visited:["Twierdza"],scouted:[],zoom:1};
 if(!Array.isArray(x.map.discovered)||!Array.isArray(x.map.visited)||!Array.isArray(x.map.scouted))throw Error("Nieprawidłowy stan mapy");
 if(LOCATIONS[x.place]&&!x.map.discovered.includes(x.place))x.map.discovered.push(x.place);
 if(LOCATIONS[x.place]&&!x.map.visited.includes(x.place))x.map.visited.push(x.place);
 if(x.ruins&&!x.map.discovered.includes("Ruiny"))x.map.discovered.push("Ruiny");
 if(x.schema===11)x.schema=12;

 if(x.schema===12){
  const positions={};for(const [place,pos] of Object.entries(x.walk.positions))positions[place+":outdoor"]=pos;

 }
 x.walk.doors??={};x.walk.room??="outdoor";x.walk.dialogs??=[];x.walk.questFlags??=[];
 if(x.schema===13)x.schema=14;
 if(!x.base)x.base={tiles:{},tool:"floor",level:0};

 if(x.schema===15)x.schema=16;
 x.base.assignments??={};x.base.maxLevel=2;x.walk.baseLevel??=0;x.base.npcTick??=0;if(x.schema===16)x.schema=17;
 if(typeof x.base.assignments!=="object"||Array.isArray(x.base.assignments))throw Error("Nieprawidłowe przydziały pracowników.");
 if(!x.base.tiles||typeof x.base.tiles!=="object"||Array.isArray(x.base.tiles))throw Error("Nieprawidłowa baza.");
 if(!Object.hasOwn(BASE_TOOLS,x.base.tool))x.base.tool="floor";
 if(!["outdoor","interior","base"].includes(x.walk.room)||!Array.isArray(x.walk.dialogs)||!Array.isArray(x.walk.questFlags))throw Error("Nieprawidłowy zapis interakcji.");
 if(x.schema===17)x.schema=18;
 x.population.residents??=[];
 if(!Array.isArray(x.population.residents))throw Error("Nieprawidłowa lista mieszkańców.");
 if(x.schema===18)x.schema=19;
 if(x.schema===19)x.schema=20;
 x.sites??={};x.buildMode=false;x.buildZoom=Math.max(.75,Math.min(2.5,Number(x.buildZoom)||1));x.buildPreview=null;x.buildBrush=false;x.buildCamera??={x:0,y:0};
 if(x.schema===20){const migrated={};for(const [k,v] of Object.entries(x.sites||{})){const m=k.match(/^([^:]+):(\d+):(\d+)$/);migrated[m?m[1]+":outdoor:"+m[2]+":"+m[3]:k]=v;}x.sites=migrated;x.schema=21;}
 x.buildBrush=false;x.buildPreview=null;
 x.worldSizes??={};x.cameraFollow??=true;if(x.schema===21)x.schema=22;
 x.worldConfig??={biomeMode:"regional",terrainDensity:50};if(x.schema===22)x.schema=23;
 x.walk.interiorId??="magazyn";x.walk.returnPos??=null;if(x.schema===23)x.schema=24;

 x.version=VERSION;

function newDay(){
 s.day++;
 if(s.technology.progress){s.technology.progress.remaining--;if(s.technology.progress.remaining<=0){const tech=s.technology.progress.id;s.technology.unlocked.push(tech);s.technology.progress=null;note("Ukończono badania: "+TECHS[tech].name);}}
 for(const v of s.fleet){if(v.condition<=0)continue;const d=VEHICLES[v.id];if(!has(d.upkeep)){v.condition=Math.max(0,v.condition-15);note("Brak zasobów na utrzymanie: "+d.name);}else spend(d.upkeep);}
 if(s.activeVehicle&&!s.fleet.some(v=>v.id===s.activeVehicle&&v.condition>0)){s.activeVehicle=null;note("Pojazd niezdolny do jazdy — podróż pieszo.");}
 const p=s.politics;
 if(p.treaties.merchants)gain({gold:8});
 if(p.treaties.nomads)gain({food:3});
 if(p.treaties.wardens&&s.day%3===0)s.reputation++;
 if(p.territories.Las==="secured")gain({wood:2});
 if(p.territories.Ruiny==="secured")gain({gold:5});
 for(const b of s.buildings){if(b.remaining>0){b.remaining--;if(b.remaining===0)note("Ukończono budowę: "+BUILDINGS[b.id].name)}}
 let available=s.population.total;
 for(const b of s.buildings.filter(x=>x.remaining===0)){
  const def=BUILDINGS[b.id];
  if(available>=def.workers){gain(def.production);available-=def.workers}
 }
 const consumption=Math.ceil(s.population.total/6);
 s.resources.food=Math.max(0,s.resources.food-consumption);
 if(s.resources.food===0){s.population.happiness=Math.max(0,s.population.happiness-8);note("Brak żywności: spadek zadowolenia.")}
 else s.population.happiness=Math.min(100,s.population.happiness+1);
 residentDay();
 const operations=baseOperations();
 for(const room of operations.rooms){if(room.enclosed&&(room.production.food||room.production.gold))gain(room.production);}
 if(s.automation.autoTrade&&s.resources.food<s.automation.foodReserve&&has({gold:30})){spend({gold:30});gain({food:10});note("Automatyczny zakup: 10 żywności za 30 złota.");}
 if(s.day>=s.events.nextDay&&!s.events.pending)triggerEvent();
 note("Nowy dzień. Zużycie żywności: "+consumption+". Produkcja ukończonych budynków została rozliczona.");
 if(s.automation.autoSave){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){note("Automatyczny zapis nieudany.")}}
 completeQuests();
}

function devSpawnNpc(){

  const x=p.x+dx,y=p.y+dy;
  if(Math.abs(dx)+Math.abs(dy)!==radius||x<0||y<0||x>=WALK_W||y>=WALK_H||map[y][x]!==".")continue;
  if(localEntities().some(n=>n.x===x&&n.y===y))continue;
  target={x,y};
 }
 if(!target){devMessage="Brak wolnego pola obok postaci. Przejdź do innego miejsca.";return;}
 const number=devNpcs.length+1;
 devNpcs.push({id:"dev-npc-"+number,name:"Testowy NPC "+number,type:"npc",place:s.place,room:s.walk.room,level:s.walk.room==="base"?s.walk.baseLevel:0,...target,dialog:["Test dialogu: witaj!","Test dialogu: ponowna rozmowa."]});
 devMessage="Dodano NPC #"+number+" w "+s.place+" ("+target.x+","+target.y+").";

function action(type,id){
 if(type==="walkPanel"){toggleWalkPanel(id);return;}
 if(type==="walkClosePanel"){walkPanel="";render();return;}
 if(type==="walkExplore"){if(s.buildMode)buildToggle();else {walkPanel="";render();}return;}
 if(type==="walkBuild"){if(!s.buildMode)buildToggle();walkPanel="build";render();return;}
 if(type==="walkGoTab"){if(id==="dev"&&!devEnabled)return;walkPanel="";tab=id;render();return;}
 if(type.startsWith("dev"))return devAction(type,id);
 if(type==="residentJob"){const [resident,job]=id.split("|");return assignResident(resident,job,null);}
 if(type==="residentRoom"){const [resident,room]=id.split("|");return assignResident(resident,"warehouse",room);}
 if(type==="residentShift"){const [resident,shift]=id.split("|");const r=ensureResidents().find(x=>x.id===resident);if(r&&["day","night"].includes(shift)){r.shift=shift;syncResidentAssignments();render();}return;}
 if(type==="eventChoice")return resolveEvent(Number(id));
 if(s.events.pending&&!['save','export'].includes(type))return alert("Najpierw rozstrzygnij wydarzenie w zakładce Wydarzenia.");
 if(s.combat && !["fightAttack","fightGuard","fightPotion","save","export"].includes(type))return alert("Najpierw zakończ walkę.");
 if(type==="buildToggle")return buildToggle();
 if(type==="buildBrushToggle")return buildBrushToggle();
 if(type==="buildZoom")return buildZoom(Number(id));
 if(type==="cameraMove"){const [dx,dy]=id.split(",").map(Number);return cameraMove(dx,dy);}
 if(type==="cameraCenter")return cameraCenter();
 if(type==="worldSize")return setWorldSize(Number(id));
 if(type==="interactWalk")return interactWalk();
 if(type==="baseLevel")return baseLevelSet(Number(id));
 if(type==="enterBase")return enterBase();
 if(type==="baseWalkLevel")return baseFloorChange(Number(id));
 if(type==="baseLiftLevel")return baseLiftChange(Number(id));
 if(type==="leaveInterior")return leaveCastleRoom();
 if(type==="interiorFloor")return interiorChangeFloor(Number(id));
 if(type==="leaveBase"){s.walk.room="outdoor";render();return;}
 if(type==="baseAssign"){const [room,delta]=id.split("|");return baseAssign(room,Number(delta));}
 if(type==="baseTool"){if(Object.hasOwn(BASE_TOOLS,id)){s.base.tool=id;s.buildPreview=null;render();}return;}
 if(type==="baseEdit"){const [x,y]=id.split(",").map(Number);return baseEdit(x,y);}
 if(type==="selectMap"){if(s.map.discovered.includes(id)){s.map.selected=id;render();}return;}
 if(type==="scout"){if(!MAP_SCOUT[s.place]||s.map.scouted.includes(s.place))return;s.map.scouted.push(s.place);gain(MAP_SCOUT[s.place]);note("Zbadano okolicę: "+s.place);return advance(2);}
 if(type==="startCampaign")return startCampaign();
 if(type==="story")return chooseStory(Number(id));
 if(["study","research","craftVehicle","vehicle","repair"].includes(type))return researchAction(type,id);
 if(["envoy","treaty","break","claim","secure"].includes(type))return politicsAction(type,id);
 if(type==="fightAttack")return fightMove("attack");
 if(type==="fightGuard")return fightMove("guard");
 if(type==="fightPotion")return fightMove("potion");
 if(type==="fightWolf")return startFight("wolf");
 if(type==="fightRaider")return startFight("raider");
 if(type==="search"){if(s.place!=="Ruiny")return alert("Dotrzyj do ruin.");if(s.searched.includes("Ruiny"))return alert("Lokacja została już przeszukana.");s.searched.push("Ruiny");gain({gold:65,wood:8});addItem(LOOT.potion);note("Przeszukano ruiny: +65 złota, +8 drewna, mikstura.");return advance(3);}
 if(type==="go"){const dest=id;if(!LOCATIONS[s.place]?.neighbors.includes(dest)||dest==="Ruiny"&&!s.ruins)return alert("Trasa niedostępna.");const d=LOCATIONS[dest];const foodCost=Math.max(0,d.cost-(unlocked("logistics")?1:0));if(!spend({food:foodCost}))return alert("Brak żywności.");
 const vehicle=s.activeVehicle&&s.fleet.find(v=>v.id===s.activeVehicle&&v.condition>0);const hours=vehicle?Math.max(1,Math.ceil(d.hours*VEHICLES[vehicle.id].hoursFactor)):d.hours;
 if(vehicle){vehicle.condition=Math.max(0,vehicle.condition-5);if(vehicle.condition===0){s.activeVehicle=null;note("Pojazd wymaga naprawy.");}}
 s.place=dest;s.walk.room="outdoor";if(!s.map.visited.includes(dest))s.map.visited.push(dest);revealNeighbors(dest);s.map.selected=dest;note("Podróż do "+dest+" ("+hours+"h, "+foodCost+" żywności).");return advance(hours);}

 if(type==="gather"){const amount=unlocked("tools")?8:5;gain({wood:amount});xp(5);note("Zebrano "+amount+" drewna.");advance(2)}
 else if(type==="sell"){if(!spend({wood:5}))return alert("Brak drewna.");gain({gold:35});note("Sprzedano 5 drewna.");advance(1)}
 else if(type==="buy"){if(!spend({gold:30}))return alert("Brak złota.");gain({food:10});note("Kupiono 10 żywności.");advance(1)}
 else if(type==="rest"){note("Odpoczynek.");advance(8)}
 else if(type==="legacyTravel"){if(!spend({food:2}))return alert("Potrzeba 2 żywności.");s.place=s.place==="Las"?"Twierdza":"Las";note("Podróż: "+s.place);advance(3)}
 else if(type==="explore"){if(s.place!=="Las")return alert("Najpierw przejdź do lasu.");if(s.ruins)return alert("Ruiny zostały już odkryte.");s.ruins=true;if(!s.map.discovered.includes("Ruiny"))s.map.discovered.push("Ruiny");gain({gold:80});xp(30);note("Odkryto ruiny: +80 złota.");advance(4)}
 else if(type==="build"){
  const def=BUILDINGS[id];if(!def)return;
  if(!spend(def.cost))return alert("Brak zasobów.");
  s.buildings.push({id,remaining:def.days});note("Rozpoczęto budowę: "+def.name);render();
 }
 else if(type==="equip"){
  const item=s.inventory.find(x=>x.id===id);if(!item||!item.slot)return;
  s.hero.equipment[item.slot]=item.id;note("Wyposażono: "+item.name);render();
 }
 else if(type==="heal"){
  const item=s.inventory.find(x=>x.id===id);if(!item||item.qty<=0||!item.heal)return;
  if(s.hero.hp===s.hero.maxHp)return alert("Zdrowie jest pełne.");
  item.qty--;s.hero.hp=Math.min(s.hero.maxHp,s.hero.hp+item.heal);note("Użyto: "+item.name);render();
 }
 else if(type==="stat"){
  if(s.hero.points<=0||!Object.hasOwn(s.hero.stats,id))return;
  s.hero.points--;s.hero.stats[id]++;note("Rozwinięto cechę: "+id);render();
 }
 else if(type==="recruit"){
  const c=s.companions.find(x=>x.id===id);if(!c||c.recruited)return;
  if(!spend({gold:100}))return alert("Potrzeba 100 złota.");
  c.recruited=true;note("Dołączył towarzysz: "+c.name);render();
 }
 else if(type==="talk"){
  const c=s.companions.find(x=>x.id===id);if(!c||!c.recruited)return;
  c.affinity=Math.min(100,c.affinity+5);note("Rozmowa z "+c.name+": relacja +5.");advance(1);
 }
 else if(type==="save")save();
 else if(type==="load")load();
 else if(type==="export")exportSave();
 else if(type==="reset"){if(confirm("Rozpocząć nową kampanię?")){s=FRESH();render()}}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s));render()}catch(e){alert("Nie udało się zapisać: "+e.message)}}
function validate(input){
 const x=migrate(structuredClone(input));
 if(!x.events||!x.automation||!x.technology||!Array.isArray(x.fleet)||!x.politics||!x.story||!Array.isArray(x.story.eventsSeen)||!Array.isArray(x.searched)||!Array.isArray(x.defeated)||!x.hero||!Array.isArray(x.companions)||!x.resources||!x.population||!Array.isArray(x.buildings)||!Array.isArray(x.log)||!x.modules||!x.settings)throw Error("Niekompletny zapis");
 for(const k of ["gold","wood","food"]){if(!Number.isFinite(x.resources[k])||x.resources[k]<0)throw Error("Nieprawidłowe zasoby");}
 if(!LOCATIONS[x.place])throw Error("Nieznana lokacja");
 return x;
}
function load(){try{const x=localStorage.getItem(KEY);if(!x)throw Error("Brak zapisu");s=validate(JSON.parse(x));devNpcs=[];note("Wczytano zapis.");render()}catch(e){alert(e.message)}}
function exportSave(){const u=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=u;a.download="universal-engine-v0243-save.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function importSave(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{s=validate(JSON.parse(r.result));devNpcs=[];render()}catch(e){alert("Import nieudany: "+e.message)}};r.readAsText(file)}

 if(tab==="inventory")return '<div class="card"><h2>Ekwipunek i wyposażenie</h2><p>Broń: '+esc(s.hero.equipment.weapon||"brak")+' • Pancerz: '+esc(s.hero.equipment.armor||"brak")+'</p>'+s.inventory.map(x=>'<div class="item"><b>'+esc(x.name)+'</b> × '+x.qty+(x.attack?' • Atak +'+x.attack:'')+(x.defense?' • Obrona +'+x.defense:'')+'<div>'+ (x.slot?button("Wyposaż","equip",x.id):x.heal?button("Użyj (+"+x.heal+" HP)","heal",x.id,x.qty<=0):'')+'</div></div>').join("")+'</div>';
 if(tab==="rpg")return '<div class="card"><h2>Postać: '+esc(s.hero.name)+'</h2><div class="grid"><div class="stat">Poziom<b>'+s.hero.level+'</b></div><div class="stat">Doświadczenie<b>'+s.hero.xp+'/'+(s.hero.level*100)+'</b></div><div class="stat">Zdrowie<b>'+s.hero.hp+'/'+s.hero.maxHp+'</b></div><div class="stat">Punkty cech<b>'+s.hero.points+'</b></div></div><h3>Cechy</h3>'+Object.entries(s.hero.stats).map(([k,v])=>'<div class="item">'+esc(k)+': '+v+' '+button("+1","stat",k,s.hero.points<=0)+'</div>').join('')+'</div>';

const TABS=[["home","Start"],["campaign","Nowa gra"],["economy","Ekonomia"],["construction","Budynki"],["population","Ludność"],["world","Mapa"],["walk","Spacer 2D"],["base","Edytor bazy"],["combat","Walka"],["inventory","Ekwipunek"],["rpg","Postać"],["companions","Towarzysze"],["quests","Zadania"],["story","Fabuła"],["diplomacy","Dyplomacja"],["territory","Terytoria"],["research","Technologie"],["vehicles","Pojazdy"],["events","Wydarzenia"],["automation","Automatyzacja"],["log","Dziennik"],["control","Engine Control"],["dev","DEV"]];
function render(){
 document.body.classList.toggle("walk-active",tab==="walk");
 if(tab!=="home"&&tab!=="campaign"&&tab!=="control"&&tab!=="dev"&&!s.modules[tab])tab="home";
 el("clock").textContent="Dzień "+s.day+" • "+String(s.hour).padStart(2,"0")+":00 • "+s.place;
 el("nav").innerHTML=TABS.filter(([k])=>k==="home"||k==="campaign"||k==="control"||(k==="dev"&&devEnabled)||s.modules[k]).map(([k,t])=>'<button data-tab="'+k+'" class="'+(tab===k?"active":"")+'">'+t+'</button>').join("");
 el("app").innerHTML=view();
 if(tab==="control")el("difficulty").value=s.settings.difficulty;
 if(tab==="walk"){drawWalk();const c=el("walkCanvas");if(c)c.style.width="100%";}
}
let painting=false,lastPaint="",suppressCanvasClick=false;
const activeTouches=new Map();let pinchStart=0,pinchZoom=1;
function pointerDistance(){const a=[...activeTouches.values()];return a.length<2?0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}

let walkHoldTimer=null,walkHoldButton=null,walkHoldRepeated=false;
function stopWalkHold(){if(walkHoldTimer!==null){clearInterval(walkHoldTimer);walkHoldTimer=null;}walkHoldButton=null;}
document.addEventListener("pointerdown",e=>{const b=e.target.closest?.("[data-walk]");if(!b||tab!=="walk"||s.buildMode)return;
 stopWalkHold();walkHoldButton=b;walkHoldRepeated=false;const [dx,dy]=b.dataset.walk.split(",").map(Number);
 walkHoldTimer=setInterval(()=>{if(!walkHoldButton||tab!=="walk"||s.buildMode){stopWalkHold();return;}walkHoldRepeated=true;moveWalk(dx,dy);},145);
});
document.addEventListener("pointerup",e=>{if(walkHoldButton&&e.target.closest?.("[data-walk]")===walkHoldButton){/* click handles a short tap */}stopWalkHold();});
document.addEventListener("pointercancel",stopWalkHold);
document.addEventListener("visibilitychange",()=>{if(document.hidden)stopWalkHold();});
document.addEventListener("pointerdown",e=>{if(e.target.id!=="walkCanvas")return;
 if(e.pointerType==="touch"){activeTouches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(activeTouches.size===2){suppressCanvasClick=true;pinchStart=pointerDistance();pinchZoom=s.buildZoom;}}
});
document.addEventListener("pointermove",e=>{if(e.target.id!=="walkCanvas")return;
 if(e.pointerType==="touch"&&activeTouches.has(e.pointerId)){
  activeTouches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(activeTouches.size>=2&&pinchStart>0){s.buildZoom=Math.max(.25,Math.min(3,Math.round(pinchZoom*pointerDistance()/pinchStart*100)/100));drawWalk();const z=el("buildZoomLabel");if(z)z.textContent=Math.round(s.buildZoom*100)+"%";return;}
 }
 // Hover nie zmienia zaznaczonego pola: drugie kliknięcie musi zatwierdzić ten sam kafelek.
});
document.addEventListener("pointerup",e=>{activeTouches.delete(e.pointerId);if(activeTouches.size<2)pinchStart=0;});
document.addEventListener("pointercancel",e=>{activeTouches.delete(e.pointerId);suppressCanvasClick=true;if(activeTouches.size<2)pinchStart=0;});
document.addEventListener("click",e=>{if(e.target.id==="walkCanvas"){if(suppressCanvasClick){suppressCanvasClick=false;return;}if(s.buildMode)buildPointer(e,true);else walkCanvasTarget(e);return;}const baseCell=e.target.closest("[data-base-x]");if(baseCell){action("baseEdit",baseCell.dataset.baseX+","+baseCell.dataset.baseY);return;}const assignment=e.target.closest("[data-base-assign]");if(assignment){action("baseAssign",assignment.dataset.baseAssign+"|"+assignment.dataset.baseDelta);return;}const baseTool=e.target.closest("[data-base-tool]");if(baseTool){action("baseTool",baseTool.dataset.baseTool);return;}const walk=e.target.closest("[data-walk]");if(walk){if(walkHoldRepeated){walkHoldRepeated=false;return;}const [dx,dy]=walk.dataset.walk.split(",").map(Number);moveWalk(dx,dy);return;}const mapNode=e.target.closest("[data-map]");if(mapNode){action("selectMap",mapNode.dataset.map);return;}const b=e.target.closest("button");if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;walkPanel="";render()}else if(b.dataset.action)action(b.dataset.action,b.dataset.id)});
document.addEventListener("keydown",e=>{if(tab==="walk"&&!s.buildMode&&!["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName)){const dir={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];if(dir){e.preventDefault();moveWalk(...dir);return;}if(e.key==="e"||e.key==="Enter"){e.preventDefault();interactWalk();return;}}const n=e.target.closest("[data-map]");if(n&&(e.key==="Enter"||e.key===" ")){e.preventDefault();action("selectMap",n.dataset.map);}});
document.addEventListener("change",e=>{
 if(e.target.dataset.residentJob){action("residentJob",e.target.dataset.residentJob+"|"+e.target.value);return;}
 if(e.target.dataset.residentRoom){action("residentRoom",e.target.dataset.residentRoom+"|"+e.target.value);return;}
 if(e.target.dataset.residentShift){action("residentShift",e.target.dataset.residentShift+"|"+e.target.value);return;}
 if(e.target.id==="worldSizeSelect"){setWorldSize(Number(e.target.value));return;}
 if(e.target.id==="terrainDensitySelect"){setTerrainDensity(e.target.value);return;}
 if(e.target.id==="devToggle"){devEnabled=e.target.checked;if(!devEnabled){devNpcs=[];if(tab==="dev")tab="control";}render();}
 else if(e.target.id==="devAmount"){devAmount=Math.max(1,Math.min(100000,Math.floor(Number(e.target.value)||1)));render();}
 else if(e.target.id==="devEnemy"){const b=el("devFightBtn");if(b)b.dataset.id=e.target.value;}
 else if(e.target.id==="devEvent"){const b=el("devEventBtn");if(b)b.dataset.id=e.target.value;}
 else if(e.target.id==="devDestination"){const b=el("devTeleportBtn");if(b)b.dataset.id=e.target.value;}
 else if(e.target.id==="titleInput"){s.settings.title=e.target.value;render()}
 else if(e.target.id==="difficulty")s.settings.difficulty=e.target.value;
 else if(e.target.dataset.campaignModule){if(!campaignDraft)campaignView();campaignDraft.modules[e.target.dataset.campaignModule]=e.target.checked;}
 else if(e.target.dataset.campaign){
  if(!campaignDraft)campaignView();
  const k=e.target.dataset.campaign,v=e.target.value;
  if(k==="genre"){const p=CAMPAIGN_PRESETS[v];campaignDraft.genre=v;for(const key of ["gold","wood","food"])campaignDraft[key]=p.resources[key];campaignDraft.population=p.population;render();}
  else if(["gold","wood","food","population"].includes(k)){campaignDraft[k]=Math.max(0,Math.min(100000,Math.floor(Number(v)||0)));}
  else campaignDraft[k]=v;
 }
 else if(e.target.dataset.auto){s.automation[e.target.dataset.auto]=e.target.checked;render()}
 else if(e.target.id==="foodReserve"){s.automation.foodReserve=Math.max(0,Math.min(1000,Number(e.target.value)||0));render()}
 else if(e.target.dataset.module){s.modules[e.target.dataset.module]=e.target.checked;render()}
 else if(e.target.id==="import")importSave(e.target.files[0]);
});
ensureResidents();render();
</script></body></html>
